name: CI

# The examples monorepo: consumes both adapter libs (git submodules under libs/)
# and is the bed for the cross-lib integration tests + the `nm` decoupling gates.
# Checks live in scripts/ci.sh (single source of truth, runnable locally); the
# jobs here check out submodules + install the toolchain / Vulkan ICD.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: these workflows only check out + build; no writes needed.
permissions:
  contents: read

defaults:
  run:
    shell: bash # so scripts/ci.sh runs on the Windows runner too

jobs:
  # Lint the workflow YAML itself (this repo's + both submodules') for safety:
  # structure, action pinning, injection, least-privilege. Uses the vendored
  # validator under .claude/skills/check-workflows — also a Claude Code skill.
  lint-workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # so it lints the libs' workflows too
      - name: Install PyYAML
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pyyaml
      - name: Validate workflow YAML (--strict)
        run: python3 .claude/skills/check-workflows/validate_workflows.py --strict

  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the two adapter libs live under libs/
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true
      - run: zig version
      # fmt + build both rungs (event-logger + clear-color). No GPU/display
      # needed to build (only to run the windowed example).
      - name: CI checks
        run: bash scripts/ci.sh check

  # The platform↔vulkan decoupling invariant: a platform-only binary drags in
  # zero Vulkan. (nm over event-logger.)
  decoupling:
    name: decoupling check (nm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true
      - run: bash scripts/ci.sh decoupling

  # The cross-lib integration suite needs a display (a window) AND a Vulkan
  # device — neither is reliably available on a GitHub runner (a software ICD +
  # xvfb is too runner-image-fragile). It's verified locally / in the dev
  # container: `bash scripts/ci.sh integration` (auto-xvfb when headless).
